    <script>
      try {
        var d = document.documentElement;
        if (localStorage.getItem("reelmotion.theme") === "dark") {
          d.classList.add("dark");
          d.setAttribute("data-theme", "sovereign-dark");
        } else {
          d.classList.remove("dark");
          d.setAttribute("data-theme", "sovereign");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "sovereign");
      }
    </script>
